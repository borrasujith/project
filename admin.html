
<!DOCTYPE html>
<html>
<head>
    <title>Campus Event Portal - Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f5fa;
            color: #333;
        }

        header {
            background: #243b64;
            color: white;
            text-align: center;
            padding: 25px;
        }

        nav {
            background: #172a49;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        section {
            background: white;
            width: 90%;
            max-width: 950px;
            margin: 25px auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px #ddd;
        }

        h2, h3 {
            color: #243b64;
        }

        input {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background: #243b64;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px 3px;
        }

        button:hover {
            background: #42649b;
        }

        .delete-btn {
            background: #c0392b;
        }

        .delete-btn:hover {
            background: #922b21;
        }

        .edit-btn {
            background: #d68910;
        }

        .edit-btn:hover {
            background: #a66a0b;
        }

        .event {
            background: #eef3fb;
            padding: 15px;
            margin: 12px 0;
            border-left: 5px solid #243b64;
            border-radius: 6px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th {
            background: #243b64;
            color: white;
        }

        tr:nth-child(even) {
            background: #f2f5fa;
        }

        footer {
            background: #243b64;
            color: white;
            text-align: center;
            padding: 18px;
        }

        @media (max-width: 600px) {
            section {
                width: 94%;
                padding: 15px;
            }

            table {
                font-size: 11px;
            }

            th, td {
                padding: 6px;
                overflow-wrap: anywhere;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Admin Panel</h1>
        <p>Campus Event Portal</p>
    </header>

    <nav>
        <a href="index.html">Back to Student Website</a>
    </nav>

    <section>
        <h2>Add New Event</h2>

        <form onsubmit="addEvent(event)">

            <input type="text" id="eventName"
                placeholder="Enter event name" required>

            <input type="date" id="eventDate" required>

            <button type="submit">Add Event</button>

        </form>
    </section>

    <section>
        <h2>Manage Events</h2>

        <div id="eventList"></div>
    </section>

    <section>
        <h2>Registered Students</h2>

        <div id="studentList"></div>
    </section>

    <footer>
        <p>Campus Event Portal | Admin Page</p>
    </footer>

    <script>

        // Load saved data

        let events = JSON.parse(localStorage.getItem("campusEvents"));

        let students = JSON.parse(localStorage.getItem("campusStudents"));

        if (!Array.isArray(events)) {
            events = [];
        }

        if (!Array.isArray(students)) {
            students = [];
        }


        // Save events

        function saveEvents() {
            localStorage.setItem("campusEvents", JSON.stringify(events));
        }


        // Save students

        function saveStudents() {
            localStorage.setItem("campusStudents", JSON.stringify(students));
        }


        // Add a new event

        function addEvent(e) {

            e.preventDefault();

            let name = document.getElementById("eventName").value.trim();

            let date = document.getElementById("eventDate").value;

            let duplicate = events.some(function(item) {
                return item.name.toLowerCase() === name.toLowerCase();
            });

            if (duplicate) {
                alert("This event already exists.");
                return;
            }

            events.push({
                name: name,
                date: date
            });

            saveEvents();

            displayEvents();

            document.querySelector("form").reset();

            alert("Event added successfully!");

        }


        // Display events

        function displayEvents() {

            let eventList = document.getElementById("eventList");

            eventList.innerHTML = "";

            if (events.length === 0) {
                eventList.textContent = "No events available.";
                return;
            }

            events.forEach(function(item, index) {

                let card = document.createElement("div");
                card.className = "event";

                let heading = document.createElement("h3");
                heading.textContent = item.name;

                let date = document.createElement("p");
                date.textContent = "Date: " + item.date;

                let editButton = document.createElement("button");
                editButton.textContent = "Edit Event";
                editButton.className = "edit-btn";

                editButton.onclick = function() {
                    editEvent(index);
                };

                let deleteButton = document.createElement("button");
                deleteButton.textContent = "Delete Event";
                deleteButton.className = "delete-btn";

                deleteButton.onclick = function() {
                    deleteEvent(index);
                };

                card.appendChild(heading);
                card.appendChild(date);
                card.appendChild(editButton);
                card.appendChild(deleteButton);

                eventList.appendChild(card);

            });

        }


        // Edit an existing event

        function editEvent(index) {

            let oldName = events[index].name;

            let oldDate = events[index].date;

            let newName = prompt("Enter new event name:", oldName);

            if (newName === null) {
                return;
            }

            newName = newName.trim();

            if (newName === "") {
                alert("Event name cannot be empty.");
                return;
            }

            let newDate = prompt("Enter new event date (YYYY-MM-DD):", oldDate);

            if (newDate === null) {
                return;
            }

            if (!/^\d{4}-\d{2}-\d{2}$/.test(newDate)) {
                alert("Please enter the date in YYYY-MM-DD format.");
                return;
            }

            let duplicate = events.some(function(item, i) {
                return i !== index &&
                    item.name.toLowerCase() === newName.toLowerCase();
            });

            if (duplicate) {
                alert("An event with this name already exists.");
                return;
            }

            // Update event details

            events[index].name = newName;
            events[index].date = newDate;

            // Update registrations if event name changes

            students.forEach(function(student) {
                if (student.event === oldName) {
                    student.event = newName;
                }
            });

            saveEvents();
            saveStudents();

            displayEvents();
            displayStudents();

            alert("Event updated successfully!");

        }


        // Delete an event

        function deleteEvent(index) {

            let confirmDelete = confirm(
                "Are you sure you want to delete this event?"
            );

            if (confirmDelete) {

                let deletedEvent = events[index].name;

                events.splice(index, 1);

                students = students.filter(function(student) {
                    return student.event !== deletedEvent;
                });

                saveEvents();
                saveStudents();

                displayEvents();
                displayStudents();

                alert("Event deleted successfully!");

            }

        }


        // Display registered students

        function displayStudents() {

            let studentList = document.getElementById("studentList");

            studentList.innerHTML = "";

            if (students.length === 0) {
                studentList.textContent =
                    "No students have registered yet.";
                return;
            }

            let table = document.createElement("table");

            let headerRow = document.createElement("tr");

            ["Name", "Registration Number", "Email", "Event"].forEach(
                function(title) {

                    let th = document.createElement("th");

                    th.textContent = title;

                    headerRow.appendChild(th);

                }
            );

            table.appendChild(headerRow);

            students.forEach(function(student) {

                let row = document.createElement("tr");

                [student.name, student.regNo, student.email, student.event]
                    .forEach(function(value) {

                        let cell = document.createElement("td");

                        cell.textContent = value;

                        row.appendChild(cell);

                    });

                table.appendChild(row);

            });

            studentList.appendChild(table);

        }


        // Initial display

        displayEvents();

        displayStudents();

    </script>

</body>
</html>
